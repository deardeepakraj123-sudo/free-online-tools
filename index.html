<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Online Word and Character Counter Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            color: #333;
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            background: #eef2f3;
            padding: 15px;
            border-radius: 6px;
        }
        .stat-box {
            text-align: center;
        }
        .stat-box h2 {
            margin: 0;
            color: #007bff;
            font-size: 22px;
        }
        .stat-box p {
            margin: 5px 0 0;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Word & Character Counter</h1>
    <textarea id="textInput" placeholder="Yahan apna text type ya paste karein..." oninput="countText()"></textarea>
    
    <div class="stats">
        <div class="stat-box">
            <h2 id="wordCount">0</h2>
            <p>Words</p>
        </div>
        <div class="stat-box">
            <h2 id="charCount">0</h2>
            <p>Characters</p>
        </div>
    </div>
</div>

<script>
    function countText() {
        const text = document.getElementById('textInput').value.trim();
        
        // Character count
        const charCount = text.length;
        document.getElementById('charCount').innerText = charCount;
        
        // Word count (handles multiple spaces correctly)
        const words = text === "" ? [] : text.split(/\s+/);
        document.getElementById('wordCount').innerText = words.length;
    }
</script>

</body>
</html>
